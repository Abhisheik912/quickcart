apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickcart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quickcart
  template:
    metadata:
      labels:
        app: quickcart
    spec:
      containers:
        - name: quickcart
          image: quickcartacr912.azurecr.io/quickcart:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
