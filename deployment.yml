apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickcart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quickcart
  template:
    metadata:
      labels:
        app: quickcart
    spec:
      containers:
        - name: quickcart
          image: abhisheik912/quickcart::latest
          ports:
            - containerPort: 8081
